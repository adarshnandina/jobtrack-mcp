[project]
name = "jobtrack-mcp"
version = "0.1.0"
description = "MCP Server for job tracking"
readme = "README.md"
authors = [
    { name = "Adarsh Kumar Reddy Nandina", email = "adarshreddyn99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2,<3",
]

[project.scripts]
jobtrack-mcp = "jobtrack_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
